[build-system]
requires = ["scikit-build-core", "nanobind"]
build-backend = "scikit_build_core.build"

[project]
name = "iox"
version = "0.1.0"
description = "Unified async IO for Linux — io_uring under a synchronous, GIL-releasing Python surface"
requires-python = ">=3.10"

[tool.scikit-build]
# Keep the wheel build out of the checked-in CMake build/ trees.
build-dir = "build-wheel"
cmake.args = [
    "-DIOX_BUILD_TESTS=OFF",
    "-DIOX_BUILD_EXAMPLES=OFF",
    "-DIOX_BUILD_BENCH=OFF",
    "-DIOX_BUILD_PYTHON=ON",
]
